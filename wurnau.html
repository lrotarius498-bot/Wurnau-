<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wurnau's Ring</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #111;
            color: #fff;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            text-align: center;
        }
        .hud {
            margin-bottom: 10px;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 5px 0;
            color: #f87171;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 13px;
            color: #9ca3af;
            margin: 0;
            min-height: 20px;
        }
        .ring {
            position: relative;
            width: 100%;
            max-width: 360px;
            height: 400px;
            background: #1f2937;
            border: 3px solid #374151;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }
        .fighter {
            position: absolute;
            transform: translate(-50%, -50%);
            font-size: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.05s ease-out;
        }
        .speech-bubble {
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 8px;
            white-space: nowrap;
            margin-bottom: 4px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .speech-bubble.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="hud">
        <h1>Wurnau's Boxing Match</h1>
        <p id="instruction">Drag your finger inside the ring to move!</p>
    </div>

    <div class="ring" id="ring">
        <!-- The Boxer (Wurnau) -->
        <div class="fighter" id="wurnau">
            <div class="speech-bubble" id="wurnauSpeech">Wurnau!</div>
            🥊
        </div>

        <!-- Your Character -->
        <div class="fighter" id="player">
            <div class="speech-bubble" id="playerSpeech">I can't let you get close!</div>
            😎
        </div>
    </div>

    <script>
        const ring = document.getElementById('ring');
        const wurnau = document.getElementById('wurnau');
        const player = document.getElementById('player');
        const wurnauSpeech = document.getElementById('wurnauSpeech');
        const playerSpeech = document.getElementById('playerSpeech');

        // Initial positions
        let playerX = 180;
        let playerY = 320;
        let wurnauX = 180;
        let wurnauY = 100;

        let speechTimer = null;

        function updatePlayerPosition(clientX, clientY) {
            const rect = ring.getBoundingClientRect();
            playerX = clientX - rect.left;
            playerY = clientY - rect.top;

            // Clamp inside ring bounds
            playerX = Math.max(25, Math.min(rect.width - 25, playerX));
            playerY = Math.max(25, Math.min(rect.height - 25, playerY));

            player.style.left = playerX + 'px';
            player.style.top = playerY + 'px';
        }

        ring.addEventListener('touchmove', (e) => {
            e.preventDefault();
            updatePlayerPosition(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        ring.addEventListener('mousemove', (e) => {
            updatePlayerPosition(e.clientX, e.clientY);
        });

        // Game loop for Wurnau's AI (he tries to approach you, but you keep running away!)
        function gameLoop() {
            const rect = ring.getBoundingClientRect();

            // Calculate distance between Wurnau and Player
            let dx = playerX - wurnauX;
            let dy = playerY - wurnauY;
            let distance = Math.sqrt(dx * dx + dy * dy);

            // Wurnau chases you slowly
            if (distance > 30) {
                let angle = Math.atan2(dy, dx);
                let speed = 2.0;
                wurnauX += Math.cos(angle) * speed;
                wurnauY += Math.sin(angle) * speed;
            }

            wurnau.style.left = wurnauX + 'px';
            wurnau.style.top = wurnauY + 'px';

            // TRIGGER: When Wurnau gets close to your character (< 120 pixels)
            if (distance < 120) {
                // Your character panics and says the line
                playerSpeech.classList.add('show');
                
                // Wurnau yells "Wurnau!" periodically
                if (!wurnauSpeech.classList.contains('show') && Math.random() < 0.03) {
                    wurnauSpeech.classList.add('show');
                    setTimeout(() => {
                        wurnauSpeech.classList.remove('show');
                    }, 1000);
                }
            } else {
                playerSpeech.classList.remove('show');
            }

            requestAnimationFrame(gameLoop);
        }

        // Make Wurnau randomly mutter "Wurnau" even from afar
        setInterval(() => {
            wurnauSpeech.classList.add('show');
            setTimeout(() => {
                wurnauSpeech.classList.remove('show');
            }, 1200);
        }, 2500);

        requestAnimationFrame(gameLoop);
    </script>

</body>
</html>
